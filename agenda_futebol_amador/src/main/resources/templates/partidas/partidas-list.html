<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: ~{::head}, ~{::body}}">
<head>
    <title th:fragment="baseHead('Partidas Disponíveis')">Partidas Disponíveis - Agenda Futebol Amador</title>
</head>
<body>
    <div th:fragment="content">
        <h2>Partidas Disponíveis</h2>
        
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        
        <div th:if="${partidas != null and !partidas.empty}">
            <table class="table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cidade</th>
                        <th>Endereço</th>
                        <th>Data/Hora</th>
                        <th>Valor</th>
                        <th>Vagas</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="partida : ${partidas}">
                        <td th:text="${partida.nome}"></td>
                        <td th:text="${partida.cidade}"></td>
                        <td th:text="${partida.endereco}"></td>
                        <td th:text="${#temporals.format(partida.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="'R$ ' + ${partida.valor}"></td>
                        <td th:text="${partida.vagaDisponivel ? (partida.maxJogadores - partida.quantidadeJogadoresInscritos) + ' vagas' : 'Lotada'}"></td>
                        <td>
                            <a th:href="@{/view/partidas/{id}(id=${partida.id})}" class="btn">Detalhes</a>
                            <a th:if="${partida.vagaDisponivel}" 
                               th:href="@{/api/v1/inscricoes/partida/{id}(id=${partida.id})}" 
                               class="btn btn-success">Inscrever-se</a>
                            <span th:unless="${partida.vagaDisponivel}" class="btn btn-danger" disabled>Lotada</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div th:if="${partidas == null or partidas.empty}">
            <p>Nenhuma partida disponível no momento.</p>
        </div>
    </div>
</body>
</html>
