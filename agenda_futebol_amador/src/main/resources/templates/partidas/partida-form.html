<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: ~{::head}, ~{::body}}">
<head>
    <title th:fragment="baseHead('Criar Partida')">Criar Partida - Agenda Futebol Amador</title>
</head>
<body>
    <div th:fragment="content">
        <h2>Criar Nova Partida</h2>
        
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        
        <form th:action="@{/api/v1/partidas}" method="post" th:object="${partidaDTO}">
            <div class="form-group">
                <label for="nome">Nome da Partida:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>
            
            <div class="form-group">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" th:field="*{cidade}" required>
            </div>
            
            <div class="form-group">
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" th:field="*{endereco}" required>
            </div>
            
            <div class="form-group">
                <label for="dataHora">Data e Hora:</label>
                <input type="datetime-local" id="dataHora" th:field="*{dataHora}" required>
            </div>
            
            <div class="form-group">
                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" th:field="*{valor}" step="0.01" min="0">
            </div>
            
            <div class="form-group">
                <label for="maxJogadores">Máximo de Jogadores:</label>
                <input type="number" id="maxJogadores" th:field="*{maxJogadores}" min="2" max="50" value="22">
            </div>
            
            <div class="form-group">
                <label for="ehPrivada">
                    <input type="checkbox" id="ehPrivada" th:field="*{ehPrivada}"> Partida Privada
                </label>
            </div>
            
            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <textarea id="descricao" th:field="*{descricao}" rows="4"></textarea>
            </div>
            
            <button type="submit" class="btn btn-success">Criar Partida</button>
            <a th:href="@{/view/perfil}" class="btn btn-warning">Cancelar</a>
        </form>
    </div>
</body>
</html>
