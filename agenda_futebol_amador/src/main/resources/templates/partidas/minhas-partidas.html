<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: ~{::head}, ~{::body}}">
<head>
    <title th:fragment="baseHead('Minhas Partidas')">Minhas Partidas - Agenda Futebol Amador</title>
</head>
<body>
    <div th:fragment="content">
        <h2>Minhas Partidas Organizadas</h2>
        
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        
        <a th:href="@{/view/partidas/nova}" class="btn btn-success">Criar Nova Partida</a>
        
        <div th:if="${minhasPartidas != null and !minhasPartidas.empty}">
            <table class="table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cidade</th>
                        <th>Data/Hora</th>
                        <th>Jogadores</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="partida : ${minhasPartidas}">
                        <td th:text="${partida.nome}"></td>
                        <td th:text="${partida.cidade}"></td>
                        <td th:text="${#temporals.format(partida.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${partida.quantidadeJogadoresInscritos} + '/' + ${partida.maxJogadores}"></td>
                        <td th:text="${partida.status}"></td>
                        <td>
                            <a th:href="@{/view/partidas/{id}(id=${partida.id})}" class="btn">Ver</a>
                            <a th:href="@{/view/partidas/{id}/inscricoes(id=${partida.id})}" class="btn">Inscrições</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div th:if="${minhasPartidas == null or minhasPartidas.empty}">
            <p>Você ainda não criou nenhuma partida.</p>
        </div>
    </div>
</body>
</html>
