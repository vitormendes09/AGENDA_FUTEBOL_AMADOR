<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout}">
<head th:replace="~{base :: head('Cadastro')}">
</head>
<body>
    <div th:fragment="content">
        <h2>Cadastro de Usuário</h2>
        
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        
        <form th:action="@{/api/v1/auth/register}" method="post" th:object="${usuarioDTO}">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha (mínimo 6 caracteres):</label>
                <input type="password" id="senha" th:field="*{senha}" required>
            </div>
            
            <div class="form-group">
                <label for="tipo">Tipo de Usuário:</label>
                <select id="tipo" th:field="*{tipo}">
                    <option value="JOGADOR">Jogador</option>
                    <option value="ADMINISTRADOR">Administrador</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-success">Cadastrar</button>
            <a th:href="@{/}" class="btn btn-warning">Cancelar</a>
        </form>
        
        <p style="margin-top: 20px;">
            Já tem conta? <a th:href="@{/view/login}">Faça login aqui</a>
        </p>
    </div>
</body>
</html>
