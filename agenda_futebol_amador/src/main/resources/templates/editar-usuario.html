<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Editar Usuário</title>
</head>
<body>
    <header>
        <h1>Editar Usuário</h1>
        <nav>
            <a th:href="@{/}">Home</a> |
            <a th:href="@{/partidas}">Partidas</a> |
            <a th:href="@{/usuarios}">Usuários</a> |
            <a th:href="@{/usuarios/cadastro}">Novo Usuário</a>
        </nav>
        <p>Usuário: <span th:text="${userName}">Administrador</span></p>
    </header>

    <main>
        <section style="max-width: 800px; margin: 0 auto; padding: 20px;">
            <div style="margin-bottom: 20px;">
                <a th:href="@{/usuarios(nome=${userName})}" 
                   style="color: #007bff; text-decoration: none; font-weight: bold;">
                    ← Voltar para Lista de Usuários
                </a>
            </div>

            <div style="padding: 20px; border: 1px solid #ccc; border-radius: 5px; background: #f9f9f9;">
                <h2>Editar Dados do Usuário</h2>
                
                <form th:action="@{/usuarios/editar/save}" th:object="${item}" method="post">
                    <input type="hidden" th:field="*{id}" />
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                        <div>
                            <label><strong>Nome:</strong></label><br>
                            <input type="text" th:field="*{nome}" required 
                                   style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;">
                            <div th:if="${#fields.hasErrors('nome')}" style="color: red; font-size: 12px;">
                                <span th:errors="*{nome}">Erro no nome</span>
                            </div>
                        </div>
                        
                        <div>
                            <label><strong>Email:</strong></label><br>
                            <input type="email" th:field="*{email}" required 
                                   style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;">
                            <div th:if="${#fields.hasErrors('email')}" style="color: red; font-size: 12px;">
                                <span th:errors="*{email}">Erro no email</span>
                            </div>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                        <div>
                            <label><strong>Senha:</strong></label><br>
                            <input type="password" th:field="*{senha}" required 
                                   style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;" 
                                   placeholder="Mínimo 6 caracteres">
                            <div th:if="${#fields.hasErrors('senha')}" style="color: red; font-size: 12px;">
                                <span th:errors="*{senha}">Erro na senha</span>
                            </div>
                        </div>
                        
                        <div>
                            <label><strong>Telefone:</strong></label><br>
                            <input type="text" th:field="*{telefone}" required 
                                   style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;">
                            <div th:if="${#fields.hasErrors('telefone')}" style="color: red; font-size: 12px;">
                                <span th:errors="*{telefone}">Erro no telefone</span>
                            </div>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                        <div>
                            <label><strong>Posição:</strong></label><br>
                            <select th:field="*{posicao}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;">
                                <option value="">Selecione...</option>
                                <option value="Goleiro">Goleiro</option>
                                <option value="Zagueiro">Zagueiro</option>
                                <option value="Lateral">Lateral</option>
                                <option value="Meio-campo">Meio-campo</option>
                                <option value="Atacante">Atacante</option>
                            </select>
                        </div>
                        
                        <div>
                            <label><strong>Nível de Habilidade:</strong></label><br>
                            <select th:field="*{nivelHabilidade}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;">
                                <option value="">Selecione...</option>
                                <option value="1">1 - Iniciante</option>
                                <option value="2">2 - Básico</option>
                                <option value="3">3 - Intermediário</option>
                                <option value="4">4 - Avançado</option>
                                <option value="5">5 - Profissional</option>
                            </select>
                        </div>
                        
                        <div>
                            <label><strong>Perfil:</strong></label><br>
                            <select th:field="*{perfil}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;">
                                <option value="JOGADOR">JOGADOR</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                        <div>
                            <label><strong>Data de Cadastro:</strong></label><br>
                            <input type="text" th:value="${#temporals.format(item.dataCadastro, 'dd/MM/yyyy HH:mm')}" 
                                   style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px; background: #f5f5f5;" 
                                   readonly>
                        </div>
                        
                        <div>
                            <label><strong>Status:</strong></label><br>
                            <select th:field="*{ativo}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;">
                                <option value="true">Ativo</option>
                                <option value="false">Inativo</option>
                            </select>
                        </div>
                    </div>
                    
                    <div style="margin-top: 25px; text-align: center;">
                        <input type="hidden" name="nome" th:value="${userName}">
                        <button type="submit" 
                                style="padding: 10px 25px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
                            Atualizar Usuário
                        </button>
                        <a th:href="@{/usuarios(nome=${userName})}" 
                           style="padding: 10px 25px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; margin-left: 15px; display: inline-block;">
                            Cancelar
                        </a>
                    </div>

                    <div th:if="${error}" style="margin-top: 15px; padding: 10px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 3px;">
                        <strong>Erro:</strong> <span th:text="${error}"></span>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer style="margin-top: 50px; padding: 20px; border-top: 1px solid #ccc; text-align: center;">
        <p>Sistema Agenda Futebol Amador - Edição de Usuários</p>
    </footer>
</body>
</html>
