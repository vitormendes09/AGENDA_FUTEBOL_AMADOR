<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout}">
<head th:replace="~{base :: head('Meu Perfil')}">
</head>
<body>
    <div th:fragment="content">
        <h2>Meu Perfil</h2>
        
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        
        <div th:if="${usuario}">
            <div class="form-group">
                <label>Nome:</label>
                <p th:text="${usuario.nome}"></p>
            </div>
            
            <div class="form-group">
                <label>Email:</label>
                <p th:text="${usuario.email}"></p>
            </div>
            
            <div class="form-group">
                <label>Tipo:</label>
                <p th:text="${usuario.tipo}"></p>
            </div>
            
            <div class="form-group">
                <label>Data de Cadastro:</label>
                <p th:text="${#temporals.format(usuario.dataCriacao, 'dd/MM/yyyy HH:mm')}"></p>
            </div>
            
            <div style="margin-top: 30px;">
                <a th:href="@{/view/partidas/nova}" class="btn btn-success">Criar Partida</a>
                <a th:href="@{/view/minhas-partidas}" class="btn">Organizar Partidas</a>
                <a th:href="@{/view/partidas}" class="btn">Participar de Partidas</a>
            </div>
        </div>
    </div>
</body>
</html>
